<div>
  <h1 class="text-2xl font-bold text-gray-900 tracking-tight">Connexion</h1>
  <p class="mt-1.5 text-sm text-gray-500">
    Accédez à l'espace d'administration de votre billetterie.
  </p>

  <!-- Erreur de connexion : au-dessus du formulaire, là où le regard revient -->
  <div
    *ngIf="errorMessage()"
    class="mt-6 flex items-start gap-2.5 rounded-lg bg-danger-50 ring-1 ring-danger-100 px-3 py-2.5"
    role="alert"
  >
    <mat-icon class="!w-5 !h-5 !text-xl text-danger-600 flex-shrink-0">error_outline</mat-icon>
    <p class="text-sm leading-5 text-danger-700">{{ errorMessage() }}</p>
  </div>

  <form (ngSubmit)="onSubmit()" novalidate class="mt-6 space-y-4">
    <div>
      <label for="email" class="block text-sm font-medium text-gray-700 mb-1.5">
        Adresse email
      </label>
      <div class="relative">
        <mat-icon class="!w-4 !h-4 !text-base text-gray-400 absolute left-3 top-5 -translate-y-1/2 pointer-events-none">mail</mat-icon>
        <input
          id="email"
          type="email"
          autocomplete="email"
          placeholder="vous@exemple.com"
          [value]="email()"
          (input)="email.set($any($event.target).value)"
          class="w-full h-10 pl-9 pr-3 rounded-lg border bg-white text-sm text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 transition-colors"
          [ngClass]="submitted() && !isValidEmail()
            ? 'border-danger-300 focus:ring-danger-500'
            : 'border-gray-200 focus:ring-primary-500 focus:border-primary-500'"
        />
      </div>
      <p *ngIf="submitted() && !isValidEmail()" class="mt-1.5 flex items-center gap-1 text-xs text-danger-600">
        <mat-icon class="!w-3.5 !h-3.5 !text-sm">error_outline</mat-icon>
        Saisissez une adresse email valide.
      </p>
    </div>

    <div>
      <label for="password" class="block text-sm font-medium text-gray-700 mb-1.5">
        Mot de passe
      </label>
      <div class="relative">
        <mat-icon class="!w-4 !h-4 !text-base text-gray-400 absolute left-3 top-5 -translate-y-1/2 pointer-events-none">lock</mat-icon>
        <input
          id="password"
          [type]="showPassword() ? 'text' : 'password'"
          autocomplete="current-password"
          placeholder="••••••••"
          [value]="password()"
          (input)="password.set($any($event.target).value)"
          class="w-full h-10 pl-9 pr-10 rounded-lg border bg-white text-sm text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 transition-colors"
          [ngClass]="submitted() && !isValidPassword()
            ? 'border-danger-300 focus:ring-danger-500'
            : 'border-gray-200 focus:ring-primary-500 focus:border-primary-500'"
        />
        <button
          type="button"
          (click)="showPassword.set(!showPassword())"
          [attr.aria-label]="showPassword() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
          class="absolute right-2 top-5 -translate-y-1/2 flex items-center justify-center h-7 w-7 rounded-md text-gray-400 hover:text-gray-700 hover:bg-gray-100 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-500"
        >
          <mat-icon class="!w-4 !h-4 !text-base">{{ showPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </div>
      <p *ngIf="submitted() && !isValidPassword()" class="mt-1.5 flex items-center gap-1 text-xs text-danger-600">
        <mat-icon class="!w-3.5 !h-3.5 !text-sm">error_outline</mat-icon>
        Saisissez votre mot de passe.
      </p>
    </div>

    <label class="flex items-center gap-2.5 cursor-pointer select-none">
      <input
        type="checkbox"
        [checked]="remember()"
        (change)="remember.set($any($event.target).checked)"
        class="h-4 w-4 rounded border-gray-300 text-primary-600 accent-primary-600 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-500"
      />
      <span class="text-sm text-gray-600">Rester connecté sur cet appareil</span>
    </label>

    <button
      type="submit"
      [disabled]="isSubmitting()"
      class="w-full inline-flex items-center justify-center gap-2 h-11 rounded-lg bg-primary text-white text-sm font-medium hover:bg-primary-800 disabled:opacity-60 disabled:cursor-not-allowed transition-colors shadow-sm focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-500 focus-visible:ring-offset-2"
    >
      <app-btn-loading *ngIf="isSubmitting()"></app-btn-loading>
      <ng-container *ngIf="!isSubmitting()">
        Se connecter
        <mat-icon class="!w-5 !h-5 !text-xl">arrow_forward</mat-icon>
      </ng-container>
    </button>
  </form>

  <p class="mt-6 text-center text-sm text-gray-500">
    Pas encore de compte ?
    <a
      routerLink="/auth/register"
      class="font-medium text-primary-700 hover:text-primary-900 transition-colors rounded focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-500"
    >
      Créer un compte
    </a>
  </p>
</div>
