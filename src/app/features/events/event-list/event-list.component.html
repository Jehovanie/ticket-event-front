<div class="w-full h-full flex flex-col bg-gray-50">
  <!-- Header Section -->
  <div class="bg-white border-b border-gray-200 px-6 py-6">
    <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">Événements</h1>
        <p class="text-sm text-gray-600 mt-1">Gérez et consultez tous vos événements</p>
      </div>
      <a routerLink="/events/new" class="inline-flex items-center justify-center gap-2 bg-blue-600 text-white px-5 py-2.5 rounded-lg font-medium hover:bg-blue-700 transition-colors duration-200 shadow-sm hover:shadow-md">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
        </svg>
        Nouvel événement
      </a>
    </div>
  </div>

  <!-- Content Section -->
  <div class="flex-1 overflow-hidden flex flex-col">
    <div *ngIf="data.isLoading" class="w-full h-full flex items-center justify-center">
      <app-loading></app-loading>
    </div>
    <div *ngIf="!data.isLoading" class="flex flex-col flex-1 h-full">
      <!-- Filters Section -->
      <div class="bg-white border-b border-gray-200 px-6 py-4">
        <app-filter-event></app-filter-event>
      </div>
      
      <!-- Events List -->
      <div class="flex-1 overflow-y-auto px-6 py-6">
        <app-list-event [events]="data.events.items"></app-list-event>
      </div>
    </div>
  </div>
</div>
