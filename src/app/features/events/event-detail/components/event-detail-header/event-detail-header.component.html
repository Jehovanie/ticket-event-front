<!-- Liseré de statut : rappelle la couleur de la carte cliquée dans la liste -->
<div
  class="h-1.5 bg-gradient-to-r"
  [ngClass]="{
    'from-primary-700 to-primary-400': getStatusKey() === 'upcoming',
    'from-success-600 to-secondary-500': getStatusKey() === 'ongoing',
    'from-gray-500 to-gray-400': getStatusKey() === 'past'
  }"
></div>

<div class="bg-white border-b border-gray-200 sticky top-0 z-10">
  <div class="px-6 lg:px-8 pt-4">
    <button
      type="button"
      (click)="back.emit()"
      class="inline-flex items-center gap-1.5 text-sm font-medium text-gray-500 hover:text-primary-700 transition-colors rounded focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-500"
    >
      <mat-icon class="!w-4 !h-4 !text-base">arrow_back</mat-icon>
      Événements
    </button>
  </div>

  <div class="px-6 lg:px-8 py-4 flex flex-col xl:flex-row xl:items-start xl:justify-between gap-5">
    <!-- Identité -->
    <div class="min-w-0 flex-1">
      <div class="flex items-center gap-2 flex-wrap">
        <span
          class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold ring-1"
          [ngClass]="{
            'bg-primary-50 text-primary-700 ring-primary-100': getStatusKey() === 'upcoming',
            'bg-success-50 text-success-700 ring-success-100': getStatusKey() === 'ongoing',
            'bg-gray-100 text-gray-600 ring-gray-200': getStatusKey() === 'past'
          }"
        >
          <span
            class="w-1.5 h-1.5 rounded-full"
            [ngClass]="{
              'bg-primary-600': getStatusKey() === 'upcoming',
              'bg-success-500 animate-pulse': getStatusKey() === 'ongoing',
              'bg-gray-400': getStatusKey() === 'past'
            }"
          ></span>
          {{ getStatusLabel() }}
        </span>

        <span
          *ngIf="category"
          class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-gray-100 text-gray-700"
        >
          <span class="w-2 h-2 rounded-full" [style.background-color]="category.color || '#9ca3af'"></span>
          {{ category.name }}
        </span>

        <span class="text-xs text-gray-400">·</span>
        <span class="text-xs font-medium text-gray-500">{{ getRelativeLabel() }}</span>
      </div>

      <h1 class="mt-2 text-2xl lg:text-3xl font-bold text-gray-900 tracking-tight">{{ event.title }}</h1>

      <div class="mt-2 flex flex-wrap items-center gap-x-5 gap-y-1 text-sm text-gray-500">
        <span class="inline-flex items-center gap-1.5 first-letter:uppercase">
          <mat-icon class="!w-4 !h-4 !text-base text-gray-400">event</mat-icon>
          {{ event.startedAt | date:'EEEE d MMMM y, HH:mm' }}
        </span>
        <span *ngIf="location" class="inline-flex items-center gap-1.5 min-w-0">
          <mat-icon class="!w-4 !h-4 !text-base text-gray-400">place</mat-icon>
          <span class="truncate">{{ location.name }}</span>
        </span>
        <span class="inline-flex items-center gap-1.5 text-gray-400">
          <mat-icon class="!w-4 !h-4 !text-base">tag</mat-icon>
          {{ event.id }}
        </span>
      </div>
    </div>

    <!-- Actions : une seule action principale, le reste en discret -->
    <div class="flex items-center gap-2 flex-wrap xl:justify-end flex-shrink-0">
      <button
        type="button"
        (click)="refresh.emit()"
        matTooltip="Actualiser"
        aria-label="Actualiser"
        class="inline-flex items-center justify-center h-10 w-10 rounded-lg border border-gray-200 text-gray-500 bg-white hover:bg-gray-50 hover:text-primary-700 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-500"
      >
        <mat-icon class="!w-5 !h-5 !text-xl">refresh</mat-icon>
      </button>

      <button
        type="button"
        (click)="viewStats.emit()"
        class="inline-flex items-center gap-2 h-10 px-3 rounded-lg border border-gray-200 text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-500"
      >
        <mat-icon class="!w-5 !h-5 !text-xl">insights</mat-icon>
        Statistiques
      </button>

      <button
        type="button"
        (click)="edit.emit()"
        class="inline-flex items-center gap-2 h-10 px-4 rounded-lg bg-primary text-white text-sm font-medium hover:bg-primary-800 transition-colors shadow-sm focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-500 focus-visible:ring-offset-2"
      >
        <mat-icon class="!w-5 !h-5 !text-xl">edit</mat-icon>
        Modifier
      </button>

      <button
        type="button"
        (click)="delete.emit()"
        [disabled]="isDeleting"
        matTooltip="Supprimer l'événement"
        aria-label="Supprimer l'événement"
        class="inline-flex items-center justify-center h-10 w-10 rounded-lg border border-gray-200 text-gray-400 bg-white hover:bg-danger-50 hover:text-danger-600 hover:border-danger-100 disabled:opacity-50 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-danger-500"
      >
        <mat-icon class="!w-5 !h-5 !text-xl">{{ isDeleting ? 'hourglass_empty' : 'delete_outline' }}</mat-icon>
      </button>
    </div>
  </div>
</div>
