<div class="w-full h-full flex flex-col bg-gray-50">
  <!-- Chargement -->
  <div *ngIf="isLoading" class="w-full h-full flex items-center justify-center">
    <app-loading></app-loading>
  </div>

  <!-- Erreur -->
  <div *ngIf="error && !isLoading" class="w-full h-full flex items-center justify-center px-6">
    <div class="max-w-sm w-full text-center bg-white border border-gray-200 rounded-xl p-8 shadow-sm">
      <span class="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-danger-50 text-danger-600">
        <mat-icon>error_outline</mat-icon>
      </span>
      <h2 class="mt-4 text-base font-semibold text-gray-900">Chargement impossible</h2>
      <p class="mt-1 text-sm text-gray-500">{{ error }}</p>
      <div class="mt-6 flex items-center justify-center gap-2">
        <button
          type="button"
          (click)="goBack()"
          class="inline-flex items-center gap-2 h-10 px-4 rounded-lg border border-gray-200 text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-500"
        >
          Retour
        </button>
        <button
          type="button"
          (click)="refresh()"
          class="inline-flex items-center gap-2 h-10 px-4 rounded-lg bg-primary text-white text-sm font-medium hover:bg-primary-800 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-500 focus-visible:ring-offset-2"
        >
          <mat-icon class="!w-5 !h-5 !text-xl">refresh</mat-icon>
          Réessayer
        </button>
      </div>
    </div>
  </div>

  <!-- Contenu -->
  <div *ngIf="event && !isLoading" class="flex-1 overflow-y-auto">
    <app-event-detail-header
      [event]="event"
      [location]="location"
      [category]="category"
      [isDeleting]="isDeleting"
      (back)="goBack()"
      (refresh)="refresh()"
      (duplicate)="duplicateEvent()"
      (edit)="editEvent()"
      (delete)="deleteEvent()"
      (viewStats)="viewTicketStats()">
    </app-event-detail-header>

    <div class="max-w-[1600px] mx-auto px-6 lg:px-8 py-6 space-y-5">
      <!-- Indicateurs clés -->
      <app-event-detail-stats
        [totalTickets]="getTotalTickets()"
        [totalRevenue]="getTotalRevenue()"
        [ticketTypesCount]="getTicketTypesCount()"
        [location]="location">
      </app-event-detail-stats>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-5 items-start">
        <app-event-detail-info
          [event]="event"
          [currentImageIndex]="currentImageIndex"
          (previousImage)="previousImage()"
          (nextImage)="nextImage()">
        </app-event-detail-info>

        <app-event-detail-metadata
          class="block space-y-5"
          [event]="event"
          [category]="category"
          [location]="location">
        </app-event-detail-metadata>
      </div>

      <app-event-detail-ticket-types
        [ticketTypes]="ticketTypes"
        [totalTickets]="getTotalTickets()"
        [totalRevenue]="getTotalRevenue()"
        (viewStats)="viewTicketStats()">
      </app-event-detail-ticket-types>
    </div>

    <!-- Signature de l'organisateur : clôture commune à toutes les fiches -->
    <app-event-detail-organizer [organizer]="organizer"></app-event-detail-organizer>
  </div>
</div>
