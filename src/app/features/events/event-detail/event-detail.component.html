<div class="w-full h-full flex flex-col bg-gray-50">
  <!-- Loading State -->
  <div *ngIf="isLoading" class="w-full h-full flex items-center justify-center">
    <app-loading></app-loading>
  </div>

  <!-- Error State -->
  <div *ngIf="error && !isLoading" class="w-full h-full flex flex-col items-center justify-center gap-4 text-center p-8">
    <mat-icon class="text-red-500 !w-16 !h-16 !text-6xl">error_outline</mat-icon>
    <h2 class="text-2xl font-semibold text-gray-800">{{ error }}</h2>
    <button mat-raised-button color="primary" (click)="refresh()" class="flex items-center gap-2">
      <mat-icon>refresh</mat-icon>
      Réessayer
    </button>
  </div>

  <!-- Event Content -->
  <div *ngIf="event && !isLoading" class="flex-1 overflow-y-auto">
    <!-- Header avec actions -->
    <app-event-detail-header 
      [event]="event"
      [isDeleting]="isDeleting"
      (back)="goBack()"
      (refresh)="refresh()"
      (duplicate)="duplicateEvent()"
      (edit)="editEvent()"
      (delete)="deleteEvent()">
    </app-event-detail-header>

    <!-- Quick Stats -->
    <app-event-detail-stats
      [totalTickets]="getTotalTickets()"
      [totalRevenue]="getTotalRevenue()"
      [ticketTypesCount]="getTicketTypesCount()"
      [location]="location">
    </app-event-detail-stats>

    <!-- Main Content Grid -->
    <div class="px-8 pb-8">
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Left Column (2/3 width) -->
        <app-event-detail-info
          [event]="event"
          [location]="location"
          [currentImageIndex]="currentImageIndex"
          (previousImage)="previousImage()"
          (nextImage)="nextImage()">
        </app-event-detail-info>

        <!-- Right Column (1/3 width) -->
        <app-event-detail-metadata
          class="block space-y-6"
          [event]="event"
          [category]="category"
          [organizer]="organizer">
        </app-event-detail-metadata>
      </div>
    </div>

    <!-- Tickets Section -->
    <app-event-detail-ticket-types
      [ticketTypes]="ticketTypes"
      [totalTickets]="getTotalTickets()"
      [totalRevenue]="getTotalRevenue()"
      (viewStats)="viewTicketStats()">
    </app-event-detail-ticket-types>
  </div>
</div>
