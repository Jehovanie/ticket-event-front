<div class="min-h-full w-full flex bg-gray-50">
  <!-- Panneau de marque : masqué sur petit écran, où il volerait la place au formulaire -->
  <aside class="hidden lg:flex lg:w-[42%] xl:w-[38%] bg-primary text-white flex-col justify-between p-10 xl:p-14">
    <div class="flex items-center gap-3">
      <span class="flex h-10 w-10 items-center justify-center rounded-xl bg-secondary-500 text-primary-900 flex-shrink-0">
        <mat-icon class="!w-5 !h-5 !text-xl">local_activity</mat-icon>
      </span>
      <div>
        <p class="font-bold leading-tight">TicketUp</p>
        <p class="text-[11px] leading-tight text-primary-300">Administration</p>
      </div>
    </div>

    <div class="max-w-md">
      <h2 class="text-3xl xl:text-4xl font-bold leading-tight tracking-tight">
        Pilotez votre billetterie,<br />sans quitter des yeux vos ventes.
      </h2>

      <ul class="mt-10 space-y-6">
        <li *ngFor="let highlight of highlights" class="flex items-start gap-4">
          <span class="flex h-10 w-10 items-center justify-center rounded-lg bg-white/10 ring-1 ring-white/15 flex-shrink-0">
            <mat-icon class="!w-5 !h-5 !text-xl text-secondary-500">{{ highlight.icon }}</mat-icon>
          </span>
          <div>
            <p class="font-medium">{{ highlight.title }}</p>
            <p class="mt-0.5 text-sm text-primary-200 leading-5">{{ highlight.text }}</p>
          </div>
        </li>
      </ul>
    </div>

    <p class="text-xs text-primary-300">© {{ 2026 }} TicketUp — Espace d'administration</p>
  </aside>

  <!-- Zone de formulaire -->
  <main class="flex-1 flex flex-col">
    <div class="lg:hidden flex items-center gap-3 px-6 py-5 border-b border-gray-200 bg-white">
      <span class="flex h-9 w-9 items-center justify-center rounded-xl bg-primary text-white flex-shrink-0">
        <mat-icon class="!w-5 !h-5 !text-xl">local_activity</mat-icon>
      </span>
      <div>
        <p class="font-bold leading-tight text-gray-900">TicketUp</p>
        <p class="text-[11px] leading-tight text-gray-500">Administration</p>
      </div>
    </div>

    <div class="flex-1 flex items-center justify-center px-6 py-10">
      <div class="w-full max-w-md">
        <router-outlet />
      </div>
    </div>
  </main>
</div>
