<div class="bg-white shadow-md rounded-md">
	<div  *ngIf="dataState.isLoading" class="flex justify-center items-center h-full">
		<app-loading></app-loading>
	</div>
	<div *ngIf="!dataState.isLoading" >
		<div class="bg-gray-200 h-14 flex items-center rounded-tl-md rounded-tr-md">
			<div class="my-2 w-full flex justify-between items-center py-4 px-4">
				<label for=""> {{ dataState.title }}</label>
				<select  *ngIf="dataState.isFilter" class="border px-2 py-1 rounded-sm cursor-pointer">
					<option value="">Trafic aujourd'hui</option>
					<option value="">Trafic last week</option>
					<option value="">Trafic last month</option>
				</select>
			</div>
		</div>

		<div class="flex justify-between gap-4 items-start px-4 pt-2 pb-4">
			<div class="w-2/3 flex flex-col justify-around">
				<ul class="text-sm space-y-2">
					<li *ngFor="let state of dataState.state" class="flex items-center">
						<ng-container *ngFor="let key of state | keyvalue">
							<span class="w-4 h-2 mr-2 rounded" [ngStyle]="{ 'background-color': key.value.color }"></span>
							Ticket
							{{ key.key | uppercase }}
							—
							{{ key.value.count }}
							places
						</ng-container>
					</li>
				</ul>
			</div>
			<div class="w-1/3">
				<div class="w-full h-full">
					<canvas baseChart [data]="doughnutChartData" [type]="doughnutChartType" [options]="chartOptions"></canvas>
				</div>
			</div>
		</div>
	</div>
</div>
